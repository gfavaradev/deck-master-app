name: Release to Google Play

on:
  push:
    branches:
      - main
  workflow_dispatch: # permette di avviare manualmente dalla UI di GitHub

jobs:
  # ── Regression tests run first; build is blocked until all green ──────────
  test:
    name: Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      # app_secrets.dart is required by lib/ even for test compilation.
      # Preflight esplicito: un secret assente o non-base64 qui fallirebbe con un
      # messaggio incomprensibile di `base64`, quindi lo diagnostichiamo noi.
      - name: Restore app_secrets.dart
        env:
          APP_SECRETS_DART_BASE64: ${{ secrets.APP_SECRETS_DART_BASE64 }}
        run: |
          if [ -z "$APP_SECRETS_DART_BASE64" ]; then
            echo "::error::Secret APP_SECRETS_DART_BASE64 assente o vuoto. Crealo con: base64 -i lib/config/app_secrets.dart | pbcopy"
            exit 1
          fi
          if ! printf '%s' "$APP_SECRETS_DART_BASE64" | base64 --decode > lib/config/app_secrets.dart 2>/dev/null; then
            echo "::error::APP_SECRETS_DART_BASE64 non contiene base64 valido (va incollato il risultato di base64, non il file in chiaro)."
            exit 1
          fi
          if ! grep -q 'class\|const' lib/config/app_secrets.dart; then
            echo "::error::app_secrets.dart decodificato ma non sembra codice Dart valido."
            exit 1
          fi
          echo "app_secrets.dart ripristinato ($(wc -c < lib/config/app_secrets.dart) byte)"

      - name: Run unit tests
        run: flutter test test/ --no-pub --reporter=github

      # NB: `flutter test integration_test/...` richiede un device connesso (fallisce
      # con "No devices are connected") e quindi non e' eseguibile su ubuntu-latest.
      # Le stesse sei suite di regressione girano headless qui sopra, perche'
      # test/regression_tests.dart le ri-esporta come widget test. L'entry point
      # integration_test/regression_suite.dart resta per l'esecuzione su device:
      #   flutter drive --driver test_driver/integration_test.dart \
      #                 --target integration_test/regression_suite.dart

  # ── Build only proceeds when tests pass ───────────────────────────────────
  build-and-deploy:
    name: Build & Deploy Android
    runs-on: ubuntu-latest
    needs: test

    steps:
      # 1. Checkout del codice
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 4. Installa dipendenze
      - name: Flutter pub get
        run: flutter pub get

      # 4b. Preflight: verifica in un colpo solo TUTTI i secret usati piu' avanti,
      #     cosi' un secret mancante si scopre subito e tutti insieme, invece di
      #     un push per volta. Non stampa mai i valori.
      - name: Check required secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in GOOGLE_SERVICES_JSON_BASE64 KEYSTORE_BASE64 KEYSTORE_PASSWORD \
                      KEY_PASSWORD KEY_ALIAS PLAY_STORE_SERVICE_ACCOUNT_JSON; do
            eval "val=\${$name}"
            if [ -z "$val" ]; then
              missing="$missing $name"
            else
              echo "  presente: $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secret mancanti o vuoti:$missing"
            exit 1
          fi

      # 5. Ricrea google-services.json dal secret
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      # 6. Ricrea il keystore dal secret
      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/deck_master_keystore.jks

      # 7. Ricrea key.properties dal secret
      - name: Restore key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../deck_master_keystore.jks
          EOF

      # 8. Ricrea il file .env dal secret (se presente)
      # Il contesto `secrets` NON e' utilizzabile in `if:`: usarlo li' produce
      # "Unrecognized named-value: 'secrets'" e fa fallire il run in avvio, senza
      # eseguire un solo job. Si passa dal contesto `env`, che in `if:` e' valido.
      - name: Restore .env
        env:
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
        if: ${{ env.ENV_FILE_BASE64 != '' }}
        run: echo "$ENV_FILE_BASE64" | base64 --decode > .env

      # 9. Build del bundle con versionCode automatico (= numero del run GitHub)
      - name: Build App Bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      # 10. Upload su Google Play (canale interno)
      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.giuseppe.deckmaster
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
